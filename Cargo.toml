[package]
name = "asciiunits"
version = "0.1.0"
repository = "https://github.com/unitsml/asciiunits-rs"
edition = "2021"
license = "BSD-2-Clause"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
parsanol = "1.5.9"
# Exact versions: the generated models' runtime (lutaml-rs) pins them.
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["preserve_order"] }
sha2 = "0.11"

[dependencies.lutaml_rs]
package = "lutaml-rs"
version = "=0.1.0"
git = "https://github.com/lutaml/lutaml-rs"
rev = "1f826b7dd0ba1545479df8a4ba715d67e2985b32"
default-features = false
features = ["runtime"]
optional = true

[features]
# Typed LutaML models generated from the Ruby model (src/generated).
models = ["dep:lutaml_rs"]

[profile.dev]
debug = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
