[package]
name = "asciiunits"
version = "0.1.0"
repository = "https://github.com/unitsml/asciiunits-rs"
edition = "2021"
license = "BSD-2-Clause"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
parsanol = { git = "https://github.com/parsanol/parsanol-rs", rev = "8f8afd878a3e91b83e43c2005459bc9dc4927851" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"

[profile.dev]
debug = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
