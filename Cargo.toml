[package]
name = "asciiunits"
version = "0.1.0"
repository = "https://github.com/unitsml/asciiunits-rs"
edition = "2021"
license = "BSD-2-Clause"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
parsanol = { git = "https://github.com/parsanol/parsanol-rs", rev = "5206a33b5417b4ecd3a601930461ed2967c871e7" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"

[profile.dev]
debug = 0
